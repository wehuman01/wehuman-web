      :root { --paper:#090B0E; --ink:#E2E5E8; --accent:#6594FA; }
    }
  </style>
  <rect width="512" height="512" fill="var(--paper)"/>
  <g fill="none" stroke="var(--ink)" stroke-width="24">
    <rect x="116" y="116" width="64" height="64"/>
    <rect x="224" y="116" width="64" height="64"/>
    <rect x="332" y="116" width="64" height="64"/>
    <rect x="116" y="224" width="64" height="64"/>
    <rect x="224" y="224" width="64" height="64"/>
    <rect x="116" y="332" width="64" height="64"/>
    <rect x="224" y="332" width="64" height="64"/>
    <rect x="332" y="332" width="64" height="64"/>
  </g>
  <rect x="314" y="206" width="100" height="100" fill="var(--accent)"/>
</svg>
